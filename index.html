<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Targil</title>
<meta name="description" content="Aide aux devoirs de maths pour les olim hadashim : traduction de l'énoncé en hébreu et résolution expliquée pas à pas.">
<meta name="theme-color" content="#f3f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1321" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Noto+Sans+Ethiopic:wght@400;600&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app. Hebrew originals and calculations sit on squared notebook paper
   (מחברת משבצות) with the red margin on the RIGHT, as in an Israeli notebook; translations sit beside them in plain type. */
:root{
  --paper:#f3f6fb;      /* page ground, cool white */
  --sheet:#ffffff;      /* cards */
  --ink:#17233d;        /* navy ink */
  --ink-2:#56627b;      /* secondary text */
  --line:#d8e0eb;       /* hairlines */
  --grid:rgba(52,96,170,.13);   /* notebook squares */
  --accent:#2347b0;     /* blue pen */
  --accent-2:#e7edff;   /* blue wash */
  --on-accent:#ffffff;
  --margin:#d44a44;     /* notebook margin red */
  --marker:#ffef6a;     /* highlighter */
  --note:#fff7d1;       /* sticky note */
  --good:#16805a; --good-bg:#e3f4ec;
  --warn:#a3501a; --warn-bg:#fcefe2;
  --shadow:0 1px 2px rgba(20,40,80,.06),0 8px 22px rgba(20,40,80,.07);
  --font-ui:"Rubik","Noto Sans Ethiopic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-he:"Frank Ruhl Libre","Rubik","Arial Hebrew","Times New Roman",serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0d1321; --sheet:#151e31; --ink:#e6ecf7; --ink-2:#9ca9c1; --line:#27324a;
    --grid:rgba(150,180,235,.10); --accent:#87a5ff; --accent-2:#1c2848; --on-accent:#0a1120;
    --margin:#e5726c; --marker:rgba(255,229,80,.32); --note:#2b2715;
    --good:#52c993; --good-bg:#11301f; --warn:#f0a565; --warn-bg:#33230f;
    --shadow:0 1px 0 rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1321; --sheet:#151e31; --ink:#e6ecf7; --ink-2:#9ca9c1; --line:#27324a;
  --grid:rgba(150,180,235,.10); --accent:#87a5ff; --accent-2:#1c2848; --on-accent:#0a1120;
  --margin:#e5726c; --marker:rgba(255,229,80,.32); --note:#2b2715;
  --good:#52c993; --good-bg:#11301f; --warn:#f0a565; --warn-bg:#33230f;
  --shadow:0 1px 0 rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin-inline:-16px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{justify-self:start;display:flex;align-items:baseline;gap:8px;background:none;border:0;padding:4px 0;cursor:pointer}
.brand-name{font-weight:700;font-size:1.15rem;letter-spacing:-.01em}
.brand-he{font-family:var(--font-he);font-size:1.15rem;color:var(--margin)}
.brand-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:var(--accent);color:var(--on-accent);font-family:var(--font-he);font-weight:700;font-size:1.3rem;line-height:1}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid transparent;background:none;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--accent-2)}
.icon-btn.sm{width:36px;height:36px;border-radius:10px;color:var(--ink-2)}
.icon{display:inline-flex;flex:none}
.icon svg{display:block}

.screen{display:flex;flex-direction:column;gap:20px;padding-top:22px}
.title{font-size:1.55rem;line-height:1.2;font-weight:700;margin:0;letter-spacing:-.015em}
.eyebrow{margin:0 0 -14px;font-size:.8rem;font-weight:500;color:var(--ink-2)}
.meta{margin:-12px 0 0;color:var(--ink-2);font-size:.92rem}
.sec-title{font-size:.76rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0}
.tr-label{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.block{display:flex;flex-direction:column;gap:10px}
.fine{margin:0;font-size:.82rem;color:var(--ink-2)}
.empty{margin:0;color:var(--ink-2)}
.badge{align-self:flex-start;justify-self:start;font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--accent-2);color:var(--accent)}
.alert{margin:0;padding:12px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:.95rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--sheet);font-weight:500;cursor:pointer;text-align:center;line-height:1.25}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-ghost{background:transparent}
.btn-big{min-height:60px;font-size:1.05rem}
.btn-wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--accent-2);border-color:var(--accent);color:var(--accent)}
.link-btn{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:none;border:0;padding:4px 0;color:var(--accent);font-size:.92rem;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link-btn:disabled{opacity:.5}

/* notebook paper */
.grid-paper{background-color:var(--sheet);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;background-position:-1px -1px}
.he{font-family:var(--font-he);font-size:1.22rem;line-height:1.75;white-space:pre-line;text-align:right;margin:0;padding:12px 16px 12px 14px;border:1px solid var(--line);border-right:3px solid var(--margin);border-radius:8px 0 0 8px;overflow-wrap:anywhere}
.he-inline{font-family:var(--font-he)}
.tr{display:grid;gap:4px}
.tr-text{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.math{font-size:1.2rem;line-height:1.9;padding:8px 14px;border-radius:8px;border:1px solid var(--line);white-space:pre-line;font-variant-numeric:tabular-nums;overflow-x:auto}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.8em;margin:0 .12em;font-variant-numeric:tabular-nums}
.frac>span[aria-hidden]{padding:0 .18em}
.frac .num{border-bottom:1.5px solid currentColor;padding-bottom:1px}
.frac .den{padding-top:2px}

/* home */
.today{font-size:clamp(1.65rem,6.4vw,2.15rem);line-height:1.12;font-weight:700;letter-spacing:-.02em;margin:0}
.today-he{font-family:var(--font-he);font-size:1.3rem;color:var(--ink-2);margin:6px 0 0}
.strip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:none;border:0;padding:0;margin-top:14px;cursor:pointer;text-align:left}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--sheet);border:1px solid var(--line);font-size:.9rem}
.chip-attn{border-color:var(--accent);color:var(--accent);font-weight:500}
.strip-edit{font-size:.86rem;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;padding:16px;min-height:140px;border-radius:var(--r);border:1px solid var(--line);background-color:var(--sheet);text-align:left;cursor:pointer;transition:transform .15s ease,border-color .15s ease}
.tile:hover{border-color:var(--accent)}
.tile:active{transform:scale(.985)}
.tile-main:hover{border-right-color:var(--margin)}
.example-head{display:flex;flex-direction:column;gap:6px}
.tile-main{grid-column:1/-1;min-height:178px;padding:20px;border-right:3px solid var(--margin);box-shadow:var(--shadow)}
.tile-ico{position:absolute;top:16px;left:16px;color:var(--ink-2)}
.tile-main .tile-ico{top:20px;left:20px;color:var(--accent)}
.tile-he{align-self:flex-end;font-family:var(--font-he);font-size:1.55rem;font-weight:500;line-height:1;color:var(--accent)}
.tile-main .tile-he{font-size:2.7rem}
.tile-title{margin-top:10px;font-weight:600;font-size:1.08rem;line-height:1.25}
.tile-main .tile-title{margin-top:auto;font-size:1.35rem}
.tile-sub{color:var(--ink-2);font-size:.88rem;line-height:1.4}
.example{display:grid;gap:10px;padding:14px 16px;border:1px dashed var(--line);border-radius:var(--r);background:transparent;text-align:left;cursor:pointer}
.example:hover{border-color:var(--accent)}
.example-he{font-family:var(--font-he);font-size:1.12rem;text-align:right}
.example-cta{display:flex;align-items:center;gap:6px;color:var(--accent);font-weight:500;font-size:.95rem}
.recent-list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);overflow:hidden}
.recent-row{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 14px;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer}
.recent-list li:first-child .recent-row{border-top:0}
.recent-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--accent-2);color:var(--accent)}
.recent-main{display:grid;min-width:0}
.recent-title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-meta{font-size:.82rem;color:var(--ink-2)}

/* capture */
.cap-body{display:flex;flex-direction:column;gap:14px}
.tip{margin:0;color:var(--ink-2)}
.cap-actions{display:grid;gap:10px}
.file-btn{position:relative;overflow:hidden;cursor:pointer}
.file-btn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.file-btn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.file-btn.is-disabled{opacity:.45;pointer-events:none}
.thumb-ph{width:100%;height:100%;display:grid;place-content:center;justify-items:center;gap:6px;color:var(--ink-2);font-size:.85rem}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.thumbs:empty{display:none}
.thumb{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--sheet)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--sheet);color:var(--ink);box-shadow:var(--shadow);cursor:pointer}

/* working */
.working{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 12px;text-align:center}
.scan{position:relative;width:min(210px,70%);aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.scan img{width:100%;height:100%;object-fit:cover;display:block}
.scan-line{position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent);box-shadow:0 0 14px var(--accent);animation:scan 2.2s ease-in-out infinite alternate}
@keyframes scan{to{top:calc(100% - 3px)}}
.pen{display:flex;gap:6px;padding:14px 18px;border-radius:10px;border:1px solid var(--line)}
.pen i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.pen i:nth-child(2){animation-delay:.2s}.pen i:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.working-label{margin:0;font-weight:600;font-size:1.05rem}

/* exercises */
.ex-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.ex-card{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r);background:var(--sheet);border:1px solid var(--line)}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-weight:600}
.ex-head .he-inline{font-weight:500;font-size:1.1rem;color:var(--ink-2)}
.figure{margin:0;padding:10px 12px;border-radius:10px;background:var(--accent-2);font-size:.95rem;display:grid;gap:2px}
.notice{margin:0;display:flex;gap:8px;align-items:center;color:var(--good);font-size:.92rem}

/* solve */
.callout{display:grid;gap:4px;padding:14px 16px;border-radius:12px;background:var(--accent-2)}
.callout p{margin:0}
.given{margin:0;padding-left:20px;display:grid;gap:4px}
.method-name{margin:0;font-weight:500}
.method-he{margin:0;font-family:var(--font-he);font-size:1.15rem;text-align:right;color:var(--ink-2)}
.steps{list-style:none;margin:0;padding:0}
.step{position:relative;display:grid;grid-template-columns:32px 1fr;gap:12px;padding-bottom:20px;animation:rise .35s ease both}
.step::before{content:"";position:absolute;left:15px;top:36px;bottom:6px;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step-n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:.95rem;font-variant-numeric:tabular-nums}
.step-body{min-width:0;display:flex;flex-direction:column;gap:8px}
.step-title{margin:4px 0 0;font-size:1.05rem;font-weight:600;line-height:1.3}
.step-explain{margin:0}
.step-ctrls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-left:44px}
.help{display:grid;gap:4px;padding:12px 14px;border-radius:10px;background:var(--note)}
.help-text{margin:0;white-space:pre-line}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.answer{display:grid;gap:12px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--sheet);box-shadow:var(--shadow);animation:rise .35s ease both}
.answer-main{margin:0;font-size:1.15rem;font-weight:600;white-space:pre-line}
.nb-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.notebook{display:grid;gap:6px}
.check,.watch{display:grid;gap:2px;padding:12px 14px;border-radius:10px}
.check{background:var(--good-bg)} .check .tr-label{color:var(--good)}
.watch{background:var(--warn-bg)} .watch .tr-label{color:var(--warn)}
.check p,.watch p{margin:0}
.divider{height:1px;background:var(--line);border:0;margin:4px 0}
.practice-card{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--sheet)}
.field{display:flex;gap:8px}
input[type=text],input[type=search],textarea{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:52px}
input:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-2)}
.feedback{margin:0;padding:10px 12px;border-radius:10px}
.feedback.ok{background:var(--good-bg)} .feedback.no{background:var(--warn-bg)}
.chat{display:flex;flex-direction:column;gap:10px}
.chat:empty{display:none}
.msg{max-width:90%;padding:10px 14px;border-radius:14px;white-space:pre-line;overflow-wrap:anywhere}
.msg p{margin:0}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--sheet);border:1px solid var(--line);border-bottom-left-radius:4px}
.ask-row{display:flex;gap:8px;align-items:flex-end}

/* lesson */
.title-he{margin:-12px 0 0;font-family:var(--font-he);font-size:1.3rem;text-align:right;color:var(--ink-2)}
.ideas{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ideas li{position:relative;padding-left:22px}
.ideas li::before{content:"";position:absolute;left:0;top:.45em;width:12px;height:10px;border-radius:2px;background:var(--marker);box-shadow:inset 0 0 0 1px var(--line)}
.pairs{display:grid;gap:16px}
.pair{display:grid;gap:6px}
.statement{margin:0;font-weight:500;white-space:pre-line}
.q{border:1px solid var(--line);border-radius:12px;background:var(--sheet);padding:12px 14px}
.q summary{cursor:pointer;font-weight:500}
.q p{margin:8px 0 0;color:var(--ink-2);white-space:pre-line}

/* words */
.words{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);overflow:hidden}
.word{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;padding:10px 10px 10px 14px;border-top:1px solid var(--line)}
.word.has-del{grid-template-columns:1fr auto auto auto}
.word:first-child{border-top:0}
.word-text{display:grid;gap:1px;min-width:0}
.word-mean{margin:0;overflow-wrap:anywhere}
.word-tr{font-size:.84rem;color:var(--ink-2);font-style:italic}
.word-he{font-family:var(--font-he);font-size:1.45rem;line-height:1.25;padding:0 4px;background:linear-gradient(transparent 56%,var(--marker) 56%);color:var(--ink)}
.reveal-btn{justify-self:start;background:none;border:1px dashed var(--line);border-radius:8px;padding:4px 10px;color:var(--ink-2);cursor:pointer;font-size:.88rem}
.is-example{opacity:.85}
.lex-tools{display:grid;grid-template-columns:1fr auto;gap:8px}

/* settings */
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--sheet);cursor:pointer;text-align:left}
.choice[aria-checked="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-2)}
.choice-main{font-weight:500}
.choice-sub{font-size:.8rem;color:var(--ink-2)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{align-items:center;padding:10px 4px;text-align:center}
.grade-he{font-family:var(--font-he);font-size:1.35rem;font-weight:500;line-height:1.2}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;max-width:calc(100% - 32px);padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--paper);font-size:.92rem;box-shadow:var(--shadow)}

.setup{display:grid;gap:6px;padding:14px 16px;border-radius:var(--r);border:1px solid var(--accent);background:var(--accent-2);text-align:left;cursor:pointer}
.key-box{padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
input[type=password]{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}

@media (prefers-reduced-motion: reduce){
  .scan-line{animation:none;top:50%}
  .pen i,.step,.answer{animation:none}
  .tile{transition:none}
}
</style>
</head>
<body>

<div class="app">
  <header class="bar" id="bar"></header>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
"use strict";

/* ---------- reference data ---------- */
const LANGS=[
  {code:"fr",native:"Français",en:"French"},
  {code:"en",native:"English",en:"English"},
  {code:"ru",native:"Русский",en:"Russian"},
  {code:"uk",native:"Українська",en:"Ukrainian"},
  {code:"es",native:"Español",en:"Spanish"},
  {code:"pt",native:"Português",en:"Portuguese"},
  {code:"am",native:"አማርኛ",en:"Amharic"}
];

/* Math text: renders a/b as a stacked fraction; everything else stays plain text. */
const FRAC=/(^|[^\w\/.,])(\d{1,4})\/(\d{1,4})(?![\w\/])/g;
function mt(text){
  const s=String(text==null?"":text), frag=document.createDocumentFragment();
  let last=0,m; FRAC.lastIndex=0;
  while((m=FRAC.exec(s))){
    const start=m.index+m[1].length;
    frag.append(s.slice(last,start));
    frag.append(h("span",{class:"frac"},h("span",{class:"sr-only"},m[2]+"/"+m[3]),h("span",{class:"num","aria-hidden":"true"},m[2]),h("span",{class:"den","aria-hidden":"true"},m[3])));
    last=start+m[2].length+1+m[3].length;
  }
  frag.append(s.slice(last));
  return frag;
}

const API_URL="https://api.anthropic.com/v1/messages";
const MODELS={default:"claude-sonnet-5-5",complex:"claude-opus-5-5",quick:"claude-haiku-5-5"};
const MAX_OUT={default:16000,complex:16000,quick:3000};
function getKey(){return str(store.get(K.key,""));}

function blobToBase64(blob){return readDataURL(blob).then(u=>String(u).split(",")[1]);}
function mergeTurns(turns){
  const out=[];
  for(const m of turns){
    const last=out[out.length-1];
    if(last&&last.role===m.role) last.content+="\n\n"+m.content;
    else out.push({role:m.role,content:String(m.content)});
  }
  return out;
}
async function callClaude(input,o){
  o=o||{};
  const key=getKey(); if(!key) throw {code:"no_key"};
  const tier=MODELS[o.modelTier]?o.modelTier:"default";
  const messages=mergeTurns(typeof input==="string"?[{role:"user",content:input}]:input);
  if(o.images&&o.images.length){
    const blocks=[];
    for(const img of Array.from(o.images)) blocks.push({type:"image",source:{type:"base64",media_type:img.type||"image/jpeg",data:await blobToBase64(img)}});
    const last=messages[messages.length-1];
    last.content=blocks.concat([{type:"text",text:last.content}]);
  }
  let res;
  try{
    res=await fetch(API_URL,{method:"POST",signal:o.signal,
      headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:MODELS[tier],max_tokens:o.maxTokens||MAX_OUT[tier],stream:true,messages})});
  }catch(e){throw (e&&e.name==="AbortError")?{code:"cancelled"}:{code:"network"};}
  if(!res.ok){
    let type="",msg="";
    try{const j=await res.json(); type=(j&&j.error&&j.error.type)||""; msg=(j&&j.error&&j.error.message)||"";}catch(e){}
    let code="upstream_error";
    if(res.status===401||res.status===403) code="bad_key";
    else if(/credit balance/i.test(msg)) code="no_credit";
    else if(res.status===429) code="rate_limited";
    else if(res.status===413) code="prompt_too_large";
    else if(res.status===529||type==="overloaded_error") code="overloaded";
    else if(res.status===400) code="invalid_request";
    throw {code,message:msg};
  }
  const reader=res.body.getReader(), dec=new TextDecoder();
  let buf="",text="",stop=null;
  try{
    for(;;){
      const r=await reader.read(); if(r.done) break;
      buf+=dec.decode(r.value,{stream:true}).replace(/\r/g,"");
      let i;
      while((i=buf.indexOf("\n\n"))>=0){
        const chunk=buf.slice(0,i); buf=buf.slice(i+2);
        const data=chunk.split("\n").filter(l=>l.indexOf("data:")===0).map(l=>l.slice(5).trim()).join("");
        if(!data) continue;
        let ev; try{ev=JSON.parse(data);}catch(e){continue;}
        if(ev.type==="content_block_delta"&&ev.delta&&ev.delta.type==="text_delta"){
          text+=ev.delta.text;
          if(o.onText){try{o.onText({text,delta:ev.delta.text});}catch(e){}}
        }else if(ev.type==="message_delta"&&ev.delta&&ev.delta.stop_reason){
          stop=ev.delta.stop_reason;
        }else if(ev.type==="error"){
          throw {code:ev.error&&ev.error.type==="overloaded_error"?"overloaded":"upstream_error",message:ev.error&&ev.error.message,text};
        }
      }
    }
  }catch(e){
    if(e&&e.code) throw e;
    if(e&&e.name==="AbortError") throw {code:"cancelled",text};
    throw {code:"network",text};
  }
  if(stop==="refusal") throw {code:"refused"};
  if(!text.trim()) throw {code:"empty_completion"};
  return {text,truncated:stop==="max_tokens"};
}
/* Reads the JSON value in a reply: whole reply, else a fenced block, else first { or [ to last } or ]. */
function parseJSON(t){
  t=String(t||"").trim();
  try{return JSON.parse(t);}catch(e){}
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(f){try{return JSON.parse(f[1]);}catch(e){}}
  const a=t.search(/[\[{]/), b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));
  if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch(e){}}
  return undefined;
}
async function callJSON(input,o){
  const r=await callClaude(input,o);
  const v=parseJSON(r.text);
  if(v===undefined) throw {code:"invalid_json",text:r.text};
  return v;
}

/* ---------- normalising Claude's JSON ---------- */
function normVocab(v){return arr(v).map(w=>({he:str(w&&w.he),translit:str(w&&w.translit),meaning:str(w&&w.meaning)})).filter(w=>w.he&&w.meaning).slice(0,12);}
function normSteps(v){return arr(v).map(s=>({title:str(s&&s.title),explain:str(s&&s.explain),math:str(s&&s.math)})).filter(s=>s.title||s.explain||s.math).slice(0,10);}
function normScan(r){
  r=r||{};
  return {topic:str(r.topic),grade_guess:str(r.grade_guess),problem:str(r.problem),
    items:arr(r.items).map((it,i)=>({label:str(it&&it.label)||String(i+1),hebrew:str(it&&it.hebrew),translation:str(it&&it.translation),figure:str(it&&it.figure)})).filter(it=>it.hebrew||it.translation).slice(0,12),
    vocabulary:normVocab(r.vocabulary)};
}
function normLesson(r){
  r=r||{}; const ex=r.example||{};
  return {title:str(r.title),title_hebrew:str(r.title_hebrew),problem:str(r.problem),
    key_ideas:arr(r.key_ideas).map(str).filter(Boolean).slice(0,6),
    translation:arr(r.translation).map(p=>({hebrew:str(p&&p.hebrew),translation:str(p&&p.translation)})).filter(p=>p.hebrew||p.translation).slice(0,16),
    example:{statement:str(ex.statement),steps:normSteps(ex.steps),answer:str(ex.answer)},
    check_questions:arr(r.check_questions).map(q=>({question:str(q&&q.question),answer:str(q&&q.answer)})).filter(q=>q.question).slice(0,4),
    vocabulary:normVocab(r.vocabulary)};
}
function normSolve(r){
  r=r||{}; const m=r.method;
  return {goal:str(r.goal),given:arr(r.given).map(str).filter(Boolean),
    method:{name:typeof m==="string"?m.trim():str(m&&m.name),hebrew:str(m&&m.hebrew)},
    steps:normSteps(r.steps),answer:str(r.answer),answer_hebrew:str(r.answer_hebrew),check:str(r.check),watch_out:str(r.watch_out)};
}
function normSimilar(r){r=r||{};return {hebrew:str(r.hebrew),translation:str(r.translation),answer:str(r.answer),steps:normSteps(r.steps)};}

const exampleCache={};
function exampleEntry(){
  const k=SAMPLE[settings.lang]?settings.lang:"en";
  const key=k+"|"+settings.lang;
  if(!exampleCache[key]){
    const s=JSON.parse(JSON.stringify(SAMPLE[k]));
    exampleCache[key]={id:"example",mode:"ex",date:Date.now(),lang:settings.lang,grade:5,example:true,data:s.data,solved:s.solved};
  }
  return exampleCache[key];
}
function getEntry(id){return id==="example"?exampleEntry():HIST.find(x=>x.id===id);}
function saveEntry(e){if(e.id!=="example") saveHist();}
function addVocab(v){
  let added=0;
  for(const w of arr(v)){
    if(LEX.some(x=>x.he===w.he&&x.lang===settings.lang)) continue;
    LEX.unshift({he:w.he,translit:w.translit,meaning:w.meaning,lang:settings.lang,added:Date.now()}); added++;
  }
  if(added) saveLex();
  return added;
}

function stepsView(steps,ctx){
  const list=h("ol",{class:"steps"});
  const ctrls=h("div",{class:"step-ctrls"});
  let shown=0;
  const nextBtn=h("button",{class:"btn btn-primary",onclick:()=>reveal(false)});
  const allBtn=h("button",{class:"link-btn",onclick:()=>{while(shown<steps.length) reveal(true);}},t("showAll"));
  function stepEl(st,i){
    const help=h("div",{class:"help",hidden:true,"aria-live":"polite"});
    let helpBtn=null;
    if(ctx.help!==false) helpBtn=h("button",{class:"link-btn",onclick:()=>helpStep(ctx,i,help,helpBtn)},t("help"));
    return h("li",{class:"step"},
      h("span",{class:"step-n","aria-hidden":"true"},String(i+1)),
      h("div",{class:"step-body"},
        st.title?h("h3",{class:"step-title"},mt(st.title)):null,
        st.explain?h("p",{class:"step-explain"},mt(st.explain)):null,
        st.math?h("div",{class:"math grid-paper"},mt(st.math)):null,
        helpBtn,help));
  }
  function reveal(quiet){
    const i=shown, el=stepEl(steps[i],i);
    list.append(el); shown++;
    if(shown>=steps.length){ctrls.remove(); if(ctx.onAllShown) ctx.onAllShown();}
    else nextBtn.textContent=t("nextStep")+" ("+(shown+1)+"/"+steps.length+")";
    if(!quiet){
      const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
      el.scrollIntoView({block:"nearest",behavior:reduce?"auto":"smooth"});
    }
  }
  ctrls.append(nextBtn,allBtn);
  const wrap=h("div",{class:"block"},list,ctrls);
  if(steps.length){
    reveal(true);
    if(ctx.all) while(shown<steps.length) reveal(true);
  }else ctrls.remove();
  return wrap;
}

function askView(ctx,id,label){
  const log=h("div",{class:"chat"});
  const ta=h("textarea",{id:id,rows:"2",placeholder:t("askPh"),"aria-label":label});
  const send=h("button",{class:"btn btn-primary",onclick:ask,"aria-label":t("send"),title:t("send")},icon("send"));
  const turns=[];
  async function ask(){
    const q=ta.value.trim(); if(!q){ta.focus();return;}
    const s=await aiReady; if(!s){toast(t("errNoAI"));return;}
    ta.value="";
    log.append(h("div",{class:"msg me"},h("p",{},q)));
    const out=h("p",{},t("thinking"));
    log.append(h("div",{class:"msg bot"},out));
    turns.push({role:"user",content:q});
    const ctl=newCtl(); send.disabled=true;
    try{
      const r=await s([{role:"user",content:chatRules(ctx)}].concat(turns.slice(-8)),{cache:false,signal:ctl.signal,onText:u=>out.replaceChildren(mt(u.text))});
      turns.push({role:"assistant",content:r.text});
    }catch(e){
      turns.pop();
      if(!(e&&e.code==="cancelled")) out.replaceChildren(e&&e.text?mt(e.text):"",e&&e.text?" ":"",errText(e));
    }finally{send.disabled=false;}
  }
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask();}});
  return h("section",{class:"block"},h("h2",{class:"sec-title"},label),log,h("div",{class:"ask-row"},ta,send));
}

    h("span",{class:"tr-label"},t("practiceTitle")),

function keySection(){
  const inp=h("input",{type:"password",id:"api-key",autocomplete:"off",spellcheck:"false",autocapitalize:"off",placeholder:"sk-ant-…","aria-label":t("keyTitle"),value:getKey()||null});

function readDataURL(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob);});}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("decode"));i.src=src;});}
function drawTo(img,maxSide){
  const w=img.naturalWidth||1,hh=img.naturalHeight||1,sc=Math.min(1,maxSide/Math.max(w,hh));
  const c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(w*sc)); c.height=Math.max(1,Math.round(hh*sc));
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return c;
}
/* Returns {blob, thumb}: the file to send to Claude (converted to JPEG when needed) and a small data: preview. */
async function prepImage(file){
  let img=null;
  try{img=await loadImg(await readDataURL(file));}catch(e){}
  let blob;
  if(img){
    /* long edge 2000 px: sharp enough for Hebrew print, light enough to send */
    blob=await new Promise((res,rej)=>drawTo(img,2000).toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",.86));
  }else{
    if(imgLimits.mediaTypes.indexOf(file.type)<0||file.size>5000000) throw new Error("unsupported");
    blob=file;
  }
  let thumb="";
  if(img){try{thumb=drawTo(img,360).toDataURL("image/jpeg",.8);}catch(e){}}
  return {blob,thumb};
}

function screenCapture(params){
  const mode=params.mode==="lesson"?"lesson":"ex";
  const photos=[];
  const maxN=()=>Math.max(1,Math.min((imgLimits&&imgLimits.maxCount)||3,4));
  const tip=h("p",{class:"tip"},t("capTip",{n:maxN()}));
  const err=h("p",{class:"alert",role:"alert",hidden:true});
  const thumbs=h("div",{class:"thumbs"});
  /* The real file input covers the whole button, so the tap lands on it directly (no scripted click). */
  function fileBtn(cls,ico,label,extra){
    const input=h("input",Object.assign({type:"file",accept:"image/*","aria-label":label,onchange:onPick},extra));
    const lab=h("label",{class:"btn file-btn "+cls},icon(ico),h("span",{},label),input);
    lab.input=input;
    return lab;
  }
  const btnCam=fileBtn("btn-primary btn-big","camera",t("takePhoto"),{id:"cam-"+mode,capture:"environment"});
  const btnGal=fileBtn("btn-ghost","image",t("pickImage"),{id:"gal-"+mode,multiple:true});
  const ta=h("textarea",{id:"text-"+mode,rows:"5",dir:"auto",placeholder:t("typePh"),"aria-label":t("typeText"),oninput:()=>sync()});
  const textBox=h("div",{class:"block",hidden:true},h("span",{class:"tr-label"},t("typeText")),ta);
  const typeBtn=h("button",{class:"link-btn",onclick:()=>openText(true)},icon("pencil",16),t("typeText"));
  function openText(focus){textBox.hidden=false;typeBtn.hidden=true;if(focus) ta.focus();}
  const analyzeBtn=h("button",{class:"btn btn-primary btn-wide btn-big",disabled:true,onclick:start},t("analyze"),icon("arrow"));
  const body=h("div",{class:"cap-body"},tip,h("div",{class:"cap-actions"},btnCam,btnGal),thumbs,typeBtn,textBox,err,analyzeBtn,h("p",{class:"fine"},t("privacy")));
  const root=h("div",{class:"screen"},
    h("p",{class:"eyebrow"},mode==="lesson"?t("modeLesson"):t("modeEx")),
    h("h1",{class:"title"},mode==="lesson"?t("capLesson"):t("capEx")),
    body);
  function showErr(m){err.textContent=m||"";err.hidden=!m;}
  function sync(){
    thumbs.replaceChildren(...photos.map((p,i)=>h("div",{class:"thumb"},
      p.thumb?h("img",{src:p.thumb,alt:t("photo")+" "+(i+1)}):h("div",{class:"thumb-ph grid-paper"},icon("image",26),h("span",{},t("photo")+" "+(i+1))),
      h("button",{type:"button","aria-label":t("remove"),title:t("remove"),onclick:()=>{photos.splice(i,1);sync();}},icon("x",18)))));
    analyzeBtn.disabled=!(photos.length||ta.value.trim());
    const full=photos.length>=maxN();
    for(const b of [btnCam,btnGal]){b.input.disabled=full;b.classList.toggle("is-disabled",full);}
    btnCam.classList.toggle("btn-primary",!photos.length);
  }
  async function onPick(e){
    const input=e.target, files=Array.from(input.files||[]);
    showErr("");
    for(const f of files){
      if(photos.length>=maxN()) break;
      try{photos.push(await prepImage(f));}catch(_){showErr(t("errImage"));}
    }
    input.value="";
    sync();
    if(photos.length&&imgLimits===null){showErr(t("errImagesOff"));openText(false);}
  }
  async function start(){
    showErr("");
    const s=await aiReady; if(!s){showErr(t("errNoAI"));return;}
    const text=ta.value.trim();
    const withImages=photos.length>0&&imgLimits!==null;
    if(!withImages&&!text){showErr(t("errImagesOff"));openText(true);return;}
    const ctl=newCtl();
    body.hidden=true;
    const work=workingView(withImages&&photos[0]?photos[0].thumb:"",t("reading"),()=>ctl.abort());
    root.append(work);
    try{
      const prompt=mode==="lesson"?promptLesson(text,withImages):promptScan(text,withImages);
      const raw=await s.json(prompt,opts({images:withImages?photos.map(p=>p.blob):null,signal:ctl.signal,modelTier:"default"}));
      const data=mode==="lesson"?normLesson(raw):normScan(raw);
      const empty=mode==="lesson"?(!data.translation.length&&!data.key_ideas.length):!data.items.length;
      if(empty) throw {code:"nothing",message:data.problem};
      const entry={id:uid(),mode,date:Date.now(),lang:settings.lang,grade:settings.grade,data,solved:{}};
      HIST.unshift(entry); HIST=HIST.slice(0,15); saveHist();
      if(withImages) sessionImages.set(entry.id,photos.map(p=>p.blob));
      const added=addVocab(data.vocabulary);
      go(mode==="lesson"?"lesson":"exercises",{id:entry.id},true);
      if(added) toast(t("addedN",{n:added}));
    }catch(e){
      work.remove(); body.hidden=false;
      if(e&&e.code==="cancelled") return;
      if(e&&e.code==="images_unavailable"){imgLimits=null;openText(true);}
      showErr(errText(e));
    }
  }
  aiReady.then(s=>{
    if(!root.isConnected) return;
    tip.textContent=t("capTip",{n:maxN()});
    if(!s) showErr(t("errNoAI"));
    else if(!getKey()) showErr(t("errNoKey"));
    else if(imgLimits===null){showErr(t("errImagesOff"));openText(false);}
  });
  return root;
}

function screenSolve(params){
  const e=getEntry(params.id); if(!e) return notFound();
  const idx=Number(params.idx)||0, it=e.data.items[idx]; if(!it) return notFound();
  const area=h("div",{});
  const root=h("div",{class:"screen"},
    h("p",{class:"eyebrow"},e.data.topic||t("modeEx")),
    h("h1",{class:"title"},t("exLabel")+" "+it.label),
    heBlock(it.hebrew),trBlock(it.translation),figureBlock(it.figure),area);
  async function load(){
    const s=await aiReady;
    if(!s){area.replaceChildren(h("p",{class:"alert",role:"alert"},aiState==="denied"?t("errDenied"):t("errNoAI")));return;}
    const ctl=newCtl();
    area.replaceChildren(workingView(null,t("solving"),()=>ctl.abort()));
    try{
      const imgs=sessionImages.get(e.id);
      const raw=await s.json(promptSolve(e,it,!!imgs),opts({images:imgs,signal:ctl.signal,modelTier:"default"}));
      const sol=normSolve(raw);
      if(!sol.steps.length) throw {code:"empty"};
      e.solved[idx]=sol; saveEntry(e);
      area.replaceChildren(solutionView(e,it,sol));
    }catch(err){
      if(err&&(err.code==="not_granted"||err.code==="sampling_disabled")) aiState="denied";
      area.replaceChildren(retryBox(err&&err.code==="cancelled"?"":errText(err),load));
    }
  }
  if(e.solved[idx]) area.append(solutionView(e,it,e.solved[idx])); else load();
  return root;
}

function screenLexicon(){
  const root=h("div",{class:"screen"},h("h1",{class:"title"},t("lexTitle")));
  if(!LEX.length){
    const sample=exampleEntry().data.vocabulary.slice(0,4);
    root.append(h("p",{class:"empty"},t("lexEmpty")),
      h("section",{class:"block"},h("span",{class:"badge"},t("exampleBadge")),h("ul",{class:"words is-example"},sample.map(w=>wordRow(w)))));
    return root;
  }
  let review=false,q="";
  const count=h("p",{class:"meta"});
  const list=h("ul",{class:"words"});
  const search=h("input",{type:"search",id:"lex-search",placeholder:t("searchPh"),"aria-label":t("searchPh"),oninput:ev=>{q=ev.target.value.trim().toLowerCase();draw();}});
  const toggle=h("button",{class:"btn btn-ghost","aria-pressed":"false",onclick:()=>{review=!review;toggle.setAttribute("aria-pressed",String(review));draw();}},t("review"));
  function draw(){
    count.textContent=t("tileLexSub",{n:LEX.length});
    const items=LEX.filter(w=>!q||w.he.indexOf(q)>=0||(w.translit||"").toLowerCase().indexOf(q)>=0||(w.meaning||"").toLowerCase().indexOf(q)>=0);
    list.replaceChildren(...items.map(w=>wordRow(w,{review,onDelete:()=>{LEX=LEX.filter(x=>x!==w);saveLex();draw();}})));
  }
  root.append(count,h("div",{class:"lex-tools"},search,toggle),list);
  draw();
  return root;
}
